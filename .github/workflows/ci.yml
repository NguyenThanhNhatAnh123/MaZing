name: MaZing CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OCR_ENABLED: "0"
      PYTHONUTF8: "1"
      MAYZING_RELEASE: ${{ github.sha }}
      MAYZING_DATA_ROOT: ${{ runner.temp }}/mayzing-ci-data
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install runtime
        run: python -m pip install -r requirements.txt
      - name: Offline regression checks
        run: python deploy/check.py
      - name: Deployment supervisor regression checks
        run: python -m unittest discover -s deploy -p "test_*.py" -v
      - name: Production smoke check
        run: python deploy/smoke.py --release "${{ github.sha }}"
