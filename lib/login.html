<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Đăng nhập · MaZing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #000; --panel: #0a0a0a; --border: #262626; --text: #ededed; --muted: #a1a1a1;
      --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
    main { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 48px 20px; }
    .login { width: 100%; max-width: 368px; }
    header { margin-bottom: 28px; text-align: center; }
    .logo { display: grid; place-items: center; width: 44px; height: 44px; margin: 0 auto 16px; border-radius: 12px; background: #fff; color: #000; font-size: 24px; font-weight: 700; }
    h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.04em; line-height: 1.25; }
    header p { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
    .card { padding: 26px; border: 1px solid var(--border); border-radius: 14px; background: var(--panel); }
    form { display: grid; gap: 20px; }
    .field { display: grid; gap: 9px; min-width: 0; }
    label { font-size: 14px; font-weight: 500; }
    input, button { font: inherit; }
    input:not([type="hidden"]) { width: 100%; min-width: 0; height: 44px; padding: 10px 12px; border: 1px solid #333; border-radius: 8px; background: #111; color: var(--text); outline: none; transition: border-color .15s; }
    input:not([type="hidden"]):focus { border-color: #a1a1a1; }
    input:focus-visible, button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    input:disabled { opacity: .5; }
    .password { position: relative; }
    .password input { padding-right: 64px; }
    .reveal { position: absolute; top: 1px; right: 1px; height: 42px; min-width: 58px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 13px; cursor: pointer; }
    .reveal:hover { color: #fff; }
    .primary { width: 100%; min-height: 44px; padding: 10px 16px; border: 1px solid #fff; border-radius: 8px; background: #fff; color: #000; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s; }
    .primary:hover { border-color: #dedede; background: #dedede; }
    .primary:disabled { opacity: .45; cursor: not-allowed; }
    .error, .notice { margin: 0; font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
    .error { color: #f87171; }
    .notice { color: var(--muted); }
    .remember { margin: 18px 0 0; color: var(--muted); font-size: 13px; text-align: center; }
    [hidden] { display: none !important; }
    @media (max-width: 420px) { main { padding: 40px 20px; } .card { padding: 24px 20px; } }
  </style>
</head>
<body>
  <main>
    <div class="login">
      <header>
        <div class="logo" aria-hidden="true">M</div>
        <h1>MaZing</h1>
        <p>Đăng nhập để tiếp tục</p>
      </header>
      <div class="card">
        <form method="post" action="/login">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <input type="hidden" name="next" value="{{ next_path }}">
          {% if username_required %}
          <div class="field">
            <label for="username">Tên đăng nhập</label>
            <input id="username" name="username" autocomplete="username" required autofocus spellcheck="false" autocapitalize="none" {% if not configured %}disabled{% endif %}>
          </div>
          {% endif %}
          <div class="field">
            <label for="password">Mật khẩu</label>
            <div class="password">
              <input id="password" name="password" type="password" autocomplete="current-password" required {% if not username_required %}autofocus{% endif %} {% if not configured %}disabled{% endif %}>
              <button id="reveal" class="reveal" type="button" aria-label="Hiện mật khẩu" aria-controls="password" aria-pressed="false" hidden>Hiện</button>
            </div>
          </div>
          {% if not configured %}<p class="notice" role="status">Chưa cấu hình tài khoản. Liên hệ quản trị viên.</p>{% endif %}
          {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
          <button id="login-submit" class="primary" type="submit" {% if not configured %}disabled{% endif %}>Đăng nhập</button>
        </form>
      </div>
      <p class="remember">Giữ đăng nhập 30 ngày</p>
    </div>
  </main>
  <script>
    (() => {
      const password = document.querySelector('#password');
      const reveal = document.querySelector('#reveal');
      const submit = document.querySelector('#login-submit');
      const initiallyDisabled = submit.disabled;
      if (!password.disabled) reveal.hidden = false;
      reveal.addEventListener('click', () => {
        const visible = password.type === 'password';
        password.type = visible ? 'text' : 'password';
        reveal.textContent = visible ? 'Ẩn' : 'Hiện';
        reveal.setAttribute('aria-label', visible ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
        reveal.setAttribute('aria-pressed', String(visible));
      });
      document.querySelector('form').addEventListener('submit', () => {
        submit.disabled = true;
        submit.textContent = 'Đang đăng nhập…';
        submit.setAttribute('aria-busy', 'true');
      });
      window.addEventListener('pageshow', () => {
        submit.disabled = initiallyDisabled;
        submit.textContent = 'Đăng nhập';
        submit.removeAttribute('aria-busy');
      });
    })();
  </script>
</body>
</html>
